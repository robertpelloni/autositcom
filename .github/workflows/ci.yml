name: CI
# WHY 3.12: av/pyaudioop/moviepy wheels the ingestion+renderer stages need
# do not exist for 3.15 (see DEPLOY.md). This is the only full-suite gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full test suite
        run: python -m pytest tests/ -q
